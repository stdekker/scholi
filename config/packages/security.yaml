security:
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        players:
            entity:
                class: App\Entity\Player
                property: tokenHash

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            # No session: the player cookie (App\Security\PlayerCookie) is checked on every request.
            stateless: true
            provider: players
            custom_authenticators:
                - App\Security\PlayerCookieAuthenticator
            logout:
                path: /speler/uitloggen
                target: app_home
                enable_csrf: true
                delete_cookies:
                    scholi_player: { path: '/' }

    # Note: Only the *first* matching rule is applied
    access_control: []
