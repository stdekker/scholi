app:
    name: Scholi
    about:
        button: Meer over Scholi
        title: Over Scholi
        text: Een vriendelijke, speelse en privacyvriendelijke leeromgeving voor kinderen. De code is open source, gratis te downloaden en voor iedereen aanpasbaar.
        close: Sluiten
        github: Bekijk de code op GitHub
        new_tab: (opent in een nieuw tabblad)

home:
    title: Kies een spel
    intro: Wat wil je vandaag oefenen?

game:
    # Shared by the bubble games (templates/game/bubble_game.html.twig).
    bubbles:
        answer: Jouw antwoord
        sum_label:
            plus: '%left% plus %right%'
            min: '%left% min %right%'
            keer: '%left% keer %right%'
        correct: 'Goed zo! %sum% = %answer%'
        try_again: Bijna! Probeer het nog eens.
        frozen: Oei, deze som is bevroren. Ga verder met een andere!
        frozen_label: '%label%, bevroren'
        revealed_label: '%label% is %answer%'
        done_frozen: 'Je hebt %solved% van de %total% sommen goed gemaakt. Oefen nog even en probeer het opnieuw!'
        remaining: 'Sommen over: %count%'
        done_late: Je hebt alle sommen gemaakt. Iets sneller de volgende keer!
        # "Je deed het dit keer in 41 seconden." (%time% is shown in colour)
        duration:
            text: 'Je deed het dit keer in %time%.'
            seconds_one: 1 seconde
            seconds_many: '%count% seconden'
            minutes_one: 1 minuut
            minutes_many: '%count% minuten'
            both: '%minutes% en %seconds%'
        again: Nog een keer
        # The level recommended after passing, e.g. "Volgende: De tafel van 7"
        next: 'Volgende: %title%'
        save_failed: Je resultaat kon niet worden bewaard. Probeer het later nog eens.
        # "Lukt het binnen %within%?"
        within:
            one_minute: een minuut
            two_minutes: twee minuten
            three_minutes: drie minuten
        ready:
            title: Ben je er klaar voor?
            text: Maak alle sommen binnen de tijd.
            button: Ik ben er klaar voor!
            go: Start!
            back: Terug
        pause:
            title: Wil je stoppen?
            text: Het spel staat even stil. Als je stopt, telt deze ronde niet.
            continue: Verder spelen
            stop: Stoppen
        timer:
            label: Tijd
            up: De tijd is om! Maak de sommen rustig af.
        keypad:
            erase: Wissen
            check: OK
    rekenen:
        title: Rekenen
        description: De tafels, plussommen en minsommen.
        intro: Wat wil je oefenen?
        back: Ander spel
        table: Tafel van %table%
        all_tables: Alle tafels
        mixes:
            title: Alle tafels
            intro: Welke tafels wil je door elkaar oefenen? Je krijgt twintig sommen en twee minuten.
            range: 'Tafels 2 tot %last%'
            practised: Geoefende tafels
            practised_locked: Maak eerst twee tafels af.
            back: Terug
        tafels:
            name: Tafels
            description: De tafels van 1 tot en met 12.
            picker_intro: Welke tafel wil je oefenen?
            title: De tafel van %table%
            intro: Klik op een som en typ het antwoord. Lukt het binnen een minuut?
            done: Helemaal goed! Je hebt alle sommen van de tafel van %table% sneller dan een minuut gemaakt.
            all:
                intro: 'Twintig sommen uit de tafels 2 tot %last% door elkaar. Klik op een som en typ het antwoord. Lukt het binnen twee minuten?'
                intro_practised: Twintig sommen uit de tafels die je al hebt geoefend, door elkaar. Klik op een som en typ het antwoord. Lukt het binnen twee minuten?
                done: Helemaal goed! Je hebt alle twintig sommen sneller dan twee minuten gemaakt.
            other_table: Andere tafel
            other_mix: Andere tafels
        erbij_eraf:
            name: Erbij en eraf
            description: Plussommen en minsommen tot 10, tot 20 en tot 100.
            choose_operation: Wat wil je oefenen?
            choose_level: Kies je niveau
            levels:
                tot_10:
                    name: Tot 10
                    example: 3 + 4 en 9 − 5
                    example_plus: 3 + 4
                    example_min: 9 − 5
                tot_20:
                    name: Tot 20 zonder brug
                    example: 12 + 5 en 17 − 4
                    example_plus: 12 + 5
                    example_min: 17 − 4
                tot_20_brug:
                    name: Tot 20 met brug
                    example: 8 + 5 en 13 − 6
                    example_plus: 8 + 5
                    example_min: 13 − 6
                tientallen:
                    name: Tientallen tot 100
                    example: 30 + 40 en 90 − 50
                    example_plus: 30 + 40
                    example_min: 90 − 50
                tot_100:
                    name: Tot 100 zonder brug
                    example: 34 + 25 en 68 − 25
                    example_plus: 34 + 25
                    example_min: 68 − 25
                tot_100_brug:
                    name: Tot 100 met brug
                    example: 38 + 7 en 52 − 18
                    example_plus: 38 + 7
                    example_min: 52 − 18
            operations:
                erbij: Erbij
                eraf: Eraf
                door_elkaar: Door elkaar
            title: '%level%: %operation%'
            intro: 'Tien sommen. Klik op een som en typ het antwoord. Lukt het binnen %within%?'
            done: 'Helemaal goed! Je hebt alle sommen sneller dan %within% gemaakt.'
            other: Ander niveau
    taal:
        title: Taal
        description: Woorden beluisteren en opschrijven.
        intro: Wat wil je oefenen?
        back: Ander spel
        dictee:
            name: Dictee
            description: Luister naar een woord en schrijf het op.
            picker_intro: Je hoort tien woorden. Schrijf ze op!
            choose_group: Kies je groep
            choose_level: Kies je niveau
            groups:
                groep_6: Groep 6
                groep_8: Groep 8
            levels:
                overschrijven:
                    name: Overschrijven
                    description: Je ziet het hele woord.
                aanvullen:
                    name: Letters aanvullen
                    description: Een deel van de letters ontbreekt.
                streepjes:
                    name: Streepjes
                    description: Je ziet alleen een streepje voor elke letter.
                zonder_hulp:
                    name: Zonder hulp
                    description: Je hoort het woord en ziet niets.
            title: 'Dictee %group%: %level%'
            intro: 'Tien woorden. Klik op een woord, luister goed en schrijf het op. Lukt het binnen %within%?'
            done: 'Helemaal goed! Je hebt alle woorden binnen %within% opgeschreven.'
            other: Ander niveau
            replay: Luister nog eens
            audio_failed: Het geluid werkt niet. Zet je geluid aan en probeer het nog eens.
            # Screen-reader label of a bubble: "Woord 3: k, leeg, t" (the hint says every letter or "leeg").
            word_label: 'Woord %number%'
            word_label_hint: 'Woord %number%: %hint%'
            blank_label: leeg
            # Replace the texts of game.bubbles that talk about sommen.
            bubbles:
                answer: Schrijf het woord
                correct: 'Goed zo! Het woord is %answer%.'
                frozen: Oei, dit woord is bevroren. Ga verder met een ander woord!
                revealed_label: '%label%: het woord is %answer%'
                done_frozen: 'Je hebt %solved% van de %total% woorden goed geschreven. Oefen nog even en probeer het opnieuw!'
                done_late: Je hebt alle woorden geschreven. Iets sneller de volgende keer!
                remaining: 'Woorden over: %count%'
                ready: Zet je geluid aan. Luister goed naar elk woord en schrijf het op.
                time_up: De tijd is om! Schrijf de woorden rustig af.

player:
    header:
        save_progress: Voortgang bewaren
        minutes: '%minutes% min'
        stats: '%badges% badges, deze week %minutes% minuten geoefend'
    new:
        title: Maak je speler
        intro: Dan bewaren we hoe goed je de sommen kent. Je hoeft alleen een naam te kiezen.
        name_label: Jouw spelersnaam
        name_help: Houd deze grappige naam, kies een andere met de dobbelsteen of verzin zelf een naam. Gebruik niet je echte naam.
        emoji_label: Jouw dier
        emoji_choose: Kies je dier
        shuffle: Andere naam
        shuffled: 'Nieuwe naam: %name%'
        submit: Maak mijn speler
        carry_over: Wat je op deze computer al hebt geoefend, gaat mee naar je nieuwe speler. ⭐
    show:
        title: 'Hoi %name%!'
        created: Je speler is gemaakt! Bewaar je spelerslink hieronder goed.
    link:
        title: Jouw spelerslink
        intro: Met deze link kom je terug bij je speler, ook op een andere computer of tablet. Deze computer onthoudt hem voor je.
        copy: Kopieer link
        copied: De link is gekopieerd!
        copy_failed: Kopiëren lukte niet. De link is geselecteerd, kopieer hem zelf.
        warning: Laat deze link alleen aan je ouders of je juf of meester zien. Wie de link heeft, speelt als jou. Kwijt is kwijt!
    practice:
        zero: Deze week heb je nog geen hele minuut geoefend.
        one: Deze week heb je 1 minuut geoefend.
        many: 'Deze week heb je %minutes% minuten geoefend.'
    progress:
        title: Jouw tafels
        not_yet: Nog niet geoefend
        passed: 'Binnen %within%! Beste tijd %time%'
        done: 'Gehaald. Beste tijd %time%'
        play: Tafels oefenen
        erbij_eraf_title: Jouw erbij en eraf
        erbij_eraf_play: Erbij en eraf oefenen
        dictee_title: Jouw dictee
        dictee_play: Dictee oefenen
        level: Niveau
    logout:
        title: Uitloggen
        intro: Speel je op een computer van school? Log dan uit. Deze computer vergeet je speler. Met je spelerslink kom je weer terug.
        submit: Uitloggen
    unknown:
        title: Deze spelerslink kennen we niet
        intro: Misschien is de link niet helemaal goed overgenomen. Kijk de link nog eens na, of maak een nieuwe speler.
        new: Maak een nieuwe speler
        home: Naar de spellen
